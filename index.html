<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#7C5CFC">
  <title>Bloom — For you. For baby. For each other.</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="css/styles.css">
<style id="bloom-brand-overrides">
/* Bloom brand — use the supplied Bloom logo throughout the interface */
.brand{
  display:flex;
  align-items:center;
  gap:12px;
  font-weight:800;
  font-size:21px;
}
.brand-logo{
  width:132px;
  height:52px;
  object-fit:contain;
  object-position:left center;
  display:block;
}
.login-logo{
  width:min(300px, 78%);
  height:auto;
  max-height:180px;
  object-fit:contain;
  display:block;
  margin:0 auto 22px;
}
.mobile-brand-logo{
  width:120px;
  height:44px;
  object-fit:contain;
}
@media(max-width:700px){
  .topbar{padding:0 16px}
  .brand-logo{width:116px;height:46px}
  .login-logo{width:min(270px,82%);max-height:160px}
}
</style>
<link rel="icon" type="image/png" sizes="32x32" href="./assets/bloom-icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/bloom-icon-180.png">
</head>
<body>
  <div id="app"></div>
  <noscript><div style="padding:24px;font-family:Arial,sans-serif">Bloom needs JavaScript enabled to sign in or create an account.</div></noscript>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
